name: Deploy to GitHub Pages

# Runs the tests, then publishes the app (index.html, src/, assets/, prototype/) to
# https://thedanny2k.github.io/ezscanner/
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Every day after tcgcsv.com refreshes TCGplayer's prices (~20:00 UTC): rebuild prices/cards.json.
  # GitHub pauses scheduled runs after 60 days without a commit; re-enable under Actions if that happens.
  schedule:
    - cron: '37 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build: test, collect the site, add today's TCGplayer prices, package it for Pages.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect the site files
        run: |
          mkdir _site
          cp -r index.html src assets prototype _site/
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build TCGplayer market prices
        # Reuses the live file when it already has today's data, and keeps it if tcgcsv is down.
        run: node scripts/build-prices.mjs _site/prices --reuse "${{ steps.pages.outputs.base_url }}/prices/cards.json"
      - name: Check the package before uploading
        run: |
          test -f _site/index.html
          test -f _site/prices/cards.json
          du -sh _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Deploy: publish what the build job packaged (GitHub's recommended setup: its own job).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
